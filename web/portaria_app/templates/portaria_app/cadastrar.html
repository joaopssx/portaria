{% extends "portaria_app/base.html" %}
{% block titulo %}Portaria - Novo cadastro{% endblock %}

{% block conteudo %}
  <div class="cartao">
    <h2>Novo cadastro</h2>

    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="tipo">Tipo</label>
      <select id="tipo" name="tipo" onchange="mostrarCampos()">
        <option value="morador">Morador</option>
        <option value="visitante">Visitante</option>
        <option value="entregador">Entregador</option>
        <option value="funcionario">Funcionario</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ dados.nome|default:'' }}" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" value="{{ dados.cpf|default:'' }}"
             placeholder="000.000.000-00" required>

      <div id="campos-morador">
        <label for="unidade">Numero da unidade</label>
        <input type="text" id="unidade" name="unidade" value="{{ dados.unidade|default:'' }}">
        <label for="bloco">Bloco</label>
        <input type="text" id="bloco" name="bloco" value="{{ dados.bloco|default:'' }}">
      </div>

      <div id="campos-entregador">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" name="empresa" value="{{ dados.empresa|default:'' }}"
               placeholder="iFood, Correios...">
      </div>

      <div id="campos-funcionario">
        <label for="funcao">Funcao</label>
        <input type="text" id="funcao" name="funcao" value="{{ dados.funcao|default:'' }}"
               placeholder="porteiro, zelador...">
        <label for="turno">Turno</label>
        <select id="turno" name="turno">
          {% for turno in turnos %}<option value="{{ turno }}">{{ turno }}</option>{% endfor %}
        </select>
      </div>

      <div id="campos-veiculo">
        <label for="placa">Placa do veiculo (opcional)</label>
        <input type="text" id="placa" name="placa" value="{{ dados.placa|default:'' }}"
               placeholder="ABC1D23">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" value="{{ dados.modelo|default:'' }}">
        <label for="cor">Cor</label>
        <input type="text" id="cor" name="cor" value="{{ dados.cor|default:'' }}">
      </div>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <script>
    // Mostra so os campos que fazem sentido para o tipo escolhido.
    function mostrarCampos() {
      var tipo = document.getElementById("tipo").value;
      var blocos = {
        "campos-morador": tipo === "morador",
        "campos-entregador": tipo === "entregador",
        "campos-funcionario": tipo === "funcionario",
        "campos-veiculo": tipo !== "funcionario"
      };
      for (var id in blocos) {
        document.getElementById(id).style.display = blocos[id] ? "block" : "none";
      }
    }
    mostrarCampos();
  </script>
{% endblock %}
